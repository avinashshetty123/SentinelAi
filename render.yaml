# Render Blueprint: FastAPI backend (Docker) + managed PostgreSQL.
# Deploy: Render dashboard → New → Blueprint → select this repository.
# The frontend is deployed separately on Vercel (root directory: frontend).
services:
  - type: web
    name: sentinelai-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: sentinelai-db
          property: connectionString
      # --- Secrets: set in the Render dashboard (sync: false = never stored in git) ---
      - key: GROQ_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false            # e.g. https://sentinelai.vercel.app
      - key: CORS_ORIGIN_REGEX
        sync: false            # optional, e.g. ^https://sentinelai-[a-z0-9-]+\.vercel\.app$
      # Secure default: token auth with a generated operator token (copy it from the dashboard
      # and enter it on the frontend Settings page). For an open public demo instead, set
      # AUTH_MODE=open and ALLOW_OPEN_MODE_IN_PRODUCTION=true explicitly.
      - key: AUTH_MODE
        value: token
      - key: ADMIN_API_TOKEN
        generateValue: true
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_ENABLED
        value: "true"
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: FORWARDED_ALLOW_IPS
        value: "*"
      - key: RATE_LIMIT_ENABLED
        value: "true"
      - key: DEMO_MODE_ENABLED
        value: "true"
      - key: RUN_MIGRATIONS_ON_START
        value: "true"
      - key: LOG_LEVEL
        value: INFO

databases:
  - name: sentinelai-db
    plan: free
    region: oregon
    databaseName: sentinel
    user: sentinel
